<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caixa - Da Lúcia</title><link rel="manifest" href="manifest-caixa.json"><meta name="theme-color" content="#A50F14">
<style>
:root { --laranja: #FFA500; --vermelho: #A50F14; --verm-esc: #7d0a0e; --lar-esc: #FF8A00; --creme: #FFF6E8; --tinta: #2B1710; --sombra: 0 10px 30px rgba(120,50,10,.14); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Inter, Arial, sans-serif; color: var(--tinta); min-height: 100vh; background: radial-gradient(1100px 560px at 8% -10%, #fff 0, transparent 60%), var(--creme); }
header { background: linear-gradient(135deg, var(--vermelho), var(--verm-esc)); color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 16px; box-shadow: var(--sombra); }
header h1 { flex: 1; font: 700 1.5rem Georgia, serif; } .lg { width: 48px; height: 48px; border-radius: 50%; }
#status { font-size: .85rem; background: rgba(255,255,255,.2); padding: 6px 14px; border-radius: 999px; }
nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 16px 28px 8px; }
.btn { padding: 12px 20px; border: 0; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; background: #fff; color: var(--tinta); box-shadow: 0 2px 8px rgba(120,50,10,.1); transition: transform .15s, box-shadow .2s; }
.btn:active { transform: scale(.96); } .btn:disabled { opacity: .4; }
.btn.on { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; }
.btn.ok { background: linear-gradient(135deg, #1f9a45, #16793a); color: #fff; box-shadow: 0 8px 18px rgba(26,127,55,.3); }
.btn.ruim { color: var(--vermelho); border: 2px solid var(--vermelho); box-shadow: none; }
input, select { padding: 12px 14px; font-size: 1rem; border: 2px solid transparent; border-radius: 14px; box-shadow: var(--sombra); outline: 0; transition: all .2s; }
input:focus { border-color: var(--laranja); box-shadow: 0 0 0 6px rgba(255,165,0,.25); }
main { max-width: 1000px; margin: 0 auto; padding: 12px 28px 40px; }
.card { background: #fff; border-radius: 24px; padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--sombra); border-left: 8px solid var(--laranja); animation: sobe .35s backwards; }
.card .topo { display: flex; gap: 14px; align-items: baseline; } .nome { flex: 1; font-weight: 700; font-size: 1.1rem; }
.num { font: 700 1.8rem Georgia, serif; color: var(--vermelho); } .valor { font: 700 1.4rem Georgia, serif; }
.card ul { margin: 8px 0 8px 18px; font-size: .92rem; line-height: 1.5; } .acoes { display: flex; gap: 10px; margin-top: 10px; } .pg { margin-top: 8px; font-size: .9rem; }
.vazio, .dica { color: #8a6f60; margin: 24px 0; text-align: center; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.cards div { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; border-radius: 22px; padding: 16px; box-shadow: var(--sombra); } .cards b { display: block; font: 700 1.6rem Georgia, serif; }
h3 { margin: 18px 0 8px; font-family: Georgia, serif; }
table { width: 100%; background: #fff; border-collapse: separate; border-radius: 18px; box-shadow: var(--sombra); margin: 10px 0; overflow: hidden; } td { padding: 12px; border-bottom: 1px solid #f1e6da; }
.modal { position: fixed; inset: 0; background: rgba(43,23,16,.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; } .modal[hidden] { display: none; }
.caixa-modal { background: #fff; padding: 26px; border-radius: 30px; width: min(440px, 94vw); box-shadow: 0 18px 44px rgba(0,0,0,.3); animation: sobe .3s backwards; }
.formas { display: flex; gap: 8px; margin: 16px 0; } .formas .btn { flex: 1; } #troco { margin-bottom: 12px; font-size: 1.1rem; }
#gate { max-width: 340px; margin: 90px auto; text-align: center; background: #fff; padding: 30px; border-radius: 30px; box-shadow: var(--sombra); }
#gate input { width: 100%; margin: 16px 0; text-align: center; font-size: 1.5rem; }
@keyframes sobe { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.largo { max-width: none !important; }
.gradewrap { overflow: auto; max-height: calc(100vh - 270px); background: #fff; border-radius: 18px; box-shadow: var(--sombra); margin-top: 12px; }
table.grade { border-collapse: separate; border-spacing: 0; font-size: .9rem; width: max-content; min-width: 100%; box-shadow: none; border-radius: 0; margin: 0; }
.grade th, .grade td { padding: 8px 10px; border-bottom: 1px solid #f1e6da; border-right: 1px solid #f6efe7; text-align: center; white-space: nowrap; }
.grade thead th { position: sticky; top: 0; background: var(--laranja); color: #fff; z-index: 2; } .grade th small { display: block; font-weight: 400; opacity: .9; }
.grade .dia { position: sticky; left: 0; background: #fff7ee; text-align: left; z-index: 1; font-weight: 700; } .grade thead .dia { background: var(--vermelho); z-index: 3; }
.grade th a { cursor: pointer; text-decoration: underline; } .grade .cel { cursor: pointer; } .grade .cel:hover { background: #FFE3A8; }
.grade tr.dom td { background: #f3ede6; color: #9a7b66; } .grade tr.tot td { background: #fff2b8; font-weight: 700; } .grade tr.saldo td { background: #FFE3A8; font-weight: 700; }
.grade tr.st td { background: #e9f6ec; white-space: normal; min-width: 140px; font-size: .8rem; }
.mini { padding: 6px 10px !important; font-size: .8rem !important; border-radius: 10px !important; margin-top: 4px; }
.lista-cli { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; margin: 10px 0; } .lista-cli .btn { text-align: left; }
.caixa-modal input, .caixa-modal select { margin: 3px 0; } .caixa-modal h4 { margin: 12px 0 4px; } .caixa-modal p { margin: 6px 0; }
.rel-topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .rel-topo label { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.grade td.alerta { background: #fde0e0 !important; color: var(--vermelho); font-weight: 700; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 170px; background: #fff; border-radius: 18px; padding: 14px 14px 8px; box-shadow: var(--sombra); margin: 10px 0 16px; }
.barra-h { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: .72rem; color: #8a6f60; }
.barra-h i { display: block; width: 100%; min-height: 2px; background: linear-gradient(180deg, var(--laranja), var(--lar-esc)); border-radius: 6px 6px 0 0; } .barra-h b { color: var(--tinta); font-size: .7rem; }
.rank-p { display: flex; align-items: center; gap: 10px; padding: 5px 0; } .rank-p span { width: 38%; } .rank-p i { height: 14px; background: var(--laranja); border-radius: 7px; } .rank-p b { margin-left: 4px; }
.extrato { background: #fffdf7; border: 1px dashed #cdbba8; border-radius: 12px; padding: 14px; font: .9rem/1.5 "Courier New", monospace; white-space: pre-wrap; max-height: 52vh; overflow: auto; }
@media print { header, nav, #lista, #gate, .acoes, .tk-x, #tec { display: none !important; } .modal { position: static !important; background: none !important; backdrop-filter: none !important; display: block !important; } .caixa-modal { box-shadow: none !important; max-height: none !important; width: auto !important; } .extrato { max-height: none; border: 0; } }
.ac-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
#ac-itens { max-height: 38vh; overflow-y: auto; }
.ac-item { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: #f7f1ea; margin-bottom: 6px; }
.ac-item.on { background: #fff3da; outline: 2px solid var(--laranja); }
.ac-chk { min-height: 0; padding: 4px 10px; font-size: 1.3rem; border: 0; background: transparent; }
.ac-nome small { display: block; color: #8a6f60; font-weight: 400; } .ac-formas { grid-column: 1 / -1; display: flex; gap: 6px; } .ac-formas .btn.on { background: var(--vermelho); color: #fff; }
.ac-chip { display: inline-block; background: #e9f6ec; color: #16793a; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; margin-left: 4px; } .ac-chip.falta { background: #fde0e0; color: var(--vermelho); }
li.pago { opacity: .7; } .caixa-modal:has(#ac-itens) { width: min(640px, 96vw); }

/* ================= VISUAL NOVO (etapa 1: tela principal) ================= */
:root { --bege: #F6E9D8; --bege-esc: #EAD7BF; --muted: #8a6f60; --verde: #1f9a45; --sombra-sm: 0 1px 2px rgba(80,35,10,.08), 0 3px 10px rgba(120,50,10,.08); --sombra: 0 1px 2px rgba(80,35,10,.06), 0 8px 24px rgba(120,50,10,.10); }
body { background: radial-gradient(900px 480px at 0% -8%, #fff 0, transparent 62%), radial-gradient(700px 400px at 100% 100%, #ffe9c9 0, transparent 60%), var(--creme); background-attachment: fixed; }

/* topo (fica fixo ao rolar) */
.topo-fixo { position: sticky; top: 0; z-index: 20; }
header { padding: 12px 28px; border-bottom: 3px solid var(--laranja); box-shadow: 0 4px 18px rgba(125,10,14,.30); }
header h1 { letter-spacing: .2px; } .lg { width: 44px; height: 44px; border: 2px solid rgba(255,255,255,.35); }
#status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.18); padding: 7px 14px; }
#status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #4ee07f; box-shadow: 0 0 0 3px rgba(78,224,127,.25); }
#status.off { background: #ffe1e1; color: var(--vermelho); font-weight: 700; border-color: transparent; } #status.off::before { background: var(--vermelho); box-shadow: 0 0 0 3px rgba(165,15,20,.2); }
header .btn.mini { width: 44px; height: 44px; margin: 0; padding: 0 !important; display: grid; place-items: center; background: rgba(255,255,255,.14); color: #fff; box-shadow: none; border: 0; font-size: 1.15rem !important; border-radius: 14px !important; }
header .btn.mini:active { background: rgba(255,255,255,.3); }

/* abas em cápsula + busca */
nav { flex-wrap: wrap; gap: 10px 14px; padding: 12px 28px; background: rgba(255,246,232,.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(234,215,191,.7); }
.abas { display: flex; gap: 4px; padding: 5px; background: var(--bege); border-radius: 999px; overflow-x: auto; flex: 1 1 max-content; min-width: 0; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas .btn { flex-shrink: 0; min-height: 0; padding: 10px 16px; background: transparent; box-shadow: none; border: 0; border-radius: 999px; color: #7a5a48; white-space: nowrap; }
.abas .btn.on { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; box-shadow: 0 4px 12px rgba(255,140,0,.35); }
.filtros { display: flex; gap: 10px; flex: 0 0 auto; margin-left: auto; }
#busca { width: 210px; } #dia { width: 160px; }
@media (max-width: 1100px) { .abas, .filtros { flex: 1 1 100%; } #busca { flex: 1; width: auto; } }

/* botões e campos */
.btn { border: 1px solid var(--bege-esc); }
.btn.ok, .btn.on { border-color: transparent; }
.btn.ok { box-shadow: 0 8px 18px rgba(26,127,55,.28), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.ruim { border: 2px solid var(--vermelho); background: #fff; }
input, select { border: 2px solid var(--bege-esc); background: #fff; box-shadow: var(--sombra-sm); }
input:focus, select:focus { border-color: var(--laranja); box-shadow: 0 0 0 5px rgba(255,165,0,.22); }

/* lista de pedidos em grade */
main { max-width: 1400px; padding: 16px 28px 50px; }
.pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start; }
.pedidos .card { margin-bottom: 0; }
.vazio-box { display: grid; place-items: center; gap: 6px; padding: 70px 20px; color: var(--muted); font-weight: 600; } .vazio-box span { font-size: 2.6rem; opacity: .55; }

/* card do pedido */
.card { border-radius: 24px; padding: 18px 20px; border: 1px solid rgba(234,215,191,.6); border-left: 8px solid var(--laranja); }
.card.st-pago { border-left-color: var(--verde); } .card.st-conta { border-left-color: #c9852b; } .card.st-cancelado { border-left-color: #b5a79b; background: #fbf8f4; }
.card .topo { display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; }
.card .topo .num { font: 700 1.15rem Georgia, serif; background: var(--vermelho); color: #fff; padding: 6px 12px; border-radius: 12px; min-width: 50px; text-align: center; }
.card .topo small { background: var(--bege); color: #7a5a48; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .75rem; }
.card .nome { flex: 1 1 110px; min-width: 0; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .hora { color: var(--muted); font-size: .85rem; font-weight: 600; }
.card .valor { font: 700 1.5rem Georgia, serif; font-variant-numeric: tabular-nums; }
.card ul { list-style: none; margin: 12px 0 4px; padding: 0; font-size: .95rem; line-height: 1.4; }
.card li { padding: 8px 0; border-top: 1px dashed #eadccb; } .card li:first-child { border-top: 1px solid #f1e6da; }
.card li i { color: var(--muted); } .it-p { float: right; margin-left: 12px; font-variant-numeric: tabular-nums; }
.card .acoes { gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.card .acoes .btn { flex: 1; min-height: 50px; padding: 10px 14px; white-space: nowrap; } .card .acoes .btn.ok { flex: 1.5; }
.pg { margin-top: 10px; padding: 10px 12px; background: #fff8ec; border-radius: 12px; line-height: 1.7; }
.st-pago .pg { background: #f3faf5; color: #2c6b43; }

/* janelas e login */
.caixa-modal { border-top: 6px solid var(--vermelho); } .caixa-modal h2 { font: 700 1.4rem Georgia, serif; }
#gate { border-top: 6px solid var(--vermelho); } #gate h2 { font: 700 1.5rem Georgia, serif; }

/* ================= JANELA DO RECEBER (etapa 2) ================= */
.caixa-modal:has(#ac-itens) { display: flex; flex-direction: column; padding: 0; overflow: hidden; width: min(740px, 96vw); max-height: 92vh; }
body.tec-on .caixa-modal:has(#ac-itens) { max-height: calc(100vh - var(--tec-h, 0px) - 20px); }
.caixa-modal:has(#ac-itens) h2 { flex-shrink: 0; padding: 22px 26px 4px; }
.ac-head { flex-shrink: 0; padding: 0 26px 14px; border-bottom: 1px solid var(--bege); }
.ac-head .dica { margin: 2px 0 12px; text-align: left; font-size: .88rem; color: var(--muted); line-height: 1.35; }
.ac-top { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin: 0; }
.ac-seg { display: flex; gap: 2px; padding: 4px; background: var(--bege); border-radius: 999px; }
.ac-seg .btn { min-height: 0; padding: 9px 16px; border: 0; border-radius: 999px; background: transparent; box-shadow: none; color: #7a5a48; font-size: .9rem; }
.ac-seg .btn:active { background: #fff; }
.ac-todos { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .ac-todos > span { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.ac-todos .btn { min-height: 42px; padding: 8px 14px; border-radius: 12px; font-size: .9rem; }
#ac-itens { flex: 1; min-height: 0; max-height: none; overflow-y: auto; overscroll-behavior: contain; padding: 14px 26px 6px; }
#ac-itens > .dica { text-align: left; color: var(--muted); font-size: .85rem; }
.ac-item { grid-template-columns: auto 1fr auto auto; gap: 8px 14px; padding: 12px 14px; margin-bottom: 10px; border-radius: 18px; background: #fbf7f2; border: 2px solid transparent; outline: 0; transition: background .15s, border-color .15s; }
.ac-item.on { background: #fff8ea; border-color: var(--laranja); outline: 0; }
.ac-chk { width: 34px; height: 34px; min-height: 0; padding: 0; display: grid; place-items: center; border: 2px solid var(--bege-esc); border-radius: 10px; background: #fff; color: #fff; font-size: 1.1rem; font-weight: 700; box-shadow: none; }
.ac-chk.on { background: var(--verde); border-color: var(--verde); }
.ac-nome b { font-size: 1rem; line-height: 1.25; } .ac-val { font: 700 1.1rem Georgia, serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ac-formas { grid-column: auto; display: flex; gap: 6px; }
.ac-formas .btn { min-height: 42px; padding: 8px 12px; border-radius: 12px; font-size: .88rem; white-space: nowrap; }
.ac-formas .btn.on { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
.ac-formas .btn:disabled { opacity: .4; }
@media (max-width: 640px) { .ac-item { grid-template-columns: auto 1fr auto; } .ac-formas { grid-column: 1 / -1; } .ac-formas .btn { flex: 1; } }
.ac-rodape { flex-shrink: 0; padding: 14px 26px 0; border-top: 1px solid var(--bege); background: #fff; }
.ac-linha { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.ac-tot small, .ac-aberto small { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
.ac-tot b { font: 700 1.8rem Georgia, serif; color: var(--verde); font-variant-numeric: tabular-nums; }
.ac-aberto { margin-left: auto; text-align: right; } .ac-aberto b { font: 700 1.1rem Georgia, serif; color: #7a5a48; }
.ac-chips { display: flex; gap: 6px; flex-wrap: wrap; } .ac-chip { margin-left: 0; }
.ac-din { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 14px; background: #f3faf5; border-radius: 14px; color: #2c6b43; font-weight: 700; }
.ac-din[hidden] { display: none; } .ac-din > span { flex: 1; } .ac-din input { width: 150px; text-align: right; font-weight: 700; } #ac-tr { min-width: 120px; text-align: right; font-size: 1.05rem; }
.caixa-modal:has(#ac-itens) .acoes { flex-shrink: 0; margin: 0; padding: 14px 26px 20px; gap: 12px; background: #fff; }
.caixa-modal:has(#ac-itens) .acoes .btn { min-height: 58px; border-radius: 16px; font-size: 1.05rem; }
.caixa-modal:has(#ac-itens) .acoes .btn:first-child { flex: 1; } #ac-ok { flex: 2; font-size: 1.15rem !important; }
#ac-ok:disabled { background: #d9c9bd; box-shadow: none; opacity: 1; color: #fff9f2; }
/* ---- Receber como PAINEL NA DIREITA (a lista de comandas continua aparecendo do lado) ---- */
.modal.lado { justify-content: flex-end; align-items: stretch; background: rgba(43,23,16,.32); backdrop-filter: none; }
.modal.lado > .caixa-modal { width: min(580px, 100vw); height: 100%; max-height: none; border-radius: 26px 0 0 26px; border-top: 0; border-left: 6px solid var(--vermelho); background: #fffdf9; animation: entraLado .22s ease-out backwards; }
body.tec-on .modal.lado > .caixa-modal { max-height: none; height: calc(100vh - var(--tec-h, 0px)); }
@keyframes entraLado { from { transform: translateX(48px); opacity: 0; } }
.ac-cab { flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 22px 12px; border-bottom: 1px solid var(--bege); }
.modal.lado .ac-cab h2 { padding: 0; margin: 0; color: var(--vermelho); font-size: 1.6rem; line-height: 1.15; }
.ac-cab small { display: block; margin-top: 3px; color: var(--muted); font-size: .85rem; }
.ac-x { flex-shrink: 0; min-height: 46px; min-width: 46px; padding: 0; border-radius: 14px; font-size: 1.1rem; }
.ac-corpo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.modal.lado #ac-itens { flex: none; overflow: visible; padding: 14px 22px 4px; }
.modal.lado .ac-head { padding: 4px 22px 16px; border-bottom: 0; }
.modal.lado .ac-extras { margin-top: 6px; }
.modal.lado .ac-pag1 { margin-top: 16px; } .modal.lado .ac-pag1 > span { display: block; margin-bottom: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--vermelho); }
.modal.lado .ac-tiles { grid-template-columns: repeat(3, 1fr); }
.modal.lado .ac-tile { position: relative; min-height: 70px; background: #fff; border: 2px solid var(--bege); }
.modal.lado .ac-tile.on { background: var(--vermelho); border-color: var(--vermelho); color: #fff; box-shadow: 0 6px 16px rgba(165,15,20,.25); }
.ac-f { font-size: .7rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.ac-tile.on .ac-f { color: inherit; opacity: .8; }
.ac-conta { border-style: dashed !important; border-color: #e3a6a6 !important; color: var(--vermelho); } .ac-conta[hidden] { display: none; }
.modal.lado .ac-rodape { background: #f6efe6; padding: 14px 22px 0; }
.ac-imp { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: .9rem; color: #7a5a48; cursor: pointer; } .ac-imp input { width: 20px; height: 20px; margin: 0; }
.modal.lado .caixa-modal .acoes { background: #f6efe6; padding: 12px 22px 18px; }
@media (max-width: 600px) { .modal.lado > .caixa-modal { border-radius: 0; border-left: 0; } .modal.lado .ac-tiles { grid-template-columns: repeat(2, 1fr); } }

/* ================= ETAPA 3: sem animação a cada atualização + Contas ================= */
.card { animation: none; }

/* cartões de resumo (Contas, Fechamento, Painel) */

.ent-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ===== tela de pagamento: formas em linha própria, doces, juntar comandas ===== */
.ac-item .ac-formas { grid-column: 1 / -1; } .ac-item .ac-formas .btn { flex: 1; justify-content: center; }

.ac-extras { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; } .ac-extras .btn { min-height: 44px; border-radius: 12px; } .ac-extras input { flex: 1; min-width: 170px; margin: 0; }
#ac-picker { margin-top: 12px; padding: 12px; background: #fbf7f2; border-radius: 16px; } #ac-picker[hidden] { display: none; }
.dc-barra { display: flex; gap: 8px; } .dc-barra input { flex: 1; min-width: 150px; margin: 0; font-size: 1.05rem; }

.conta-it.dev { border-left-color: var(--vermelho); } .conta-it.ok { border-left-color: var(--verde); } .conta-it:active { background: #fff8ec; }
.ci-nome b { display: block; font-size: 1.05rem; } .ci-nome small, .ci-num small { display: block; color: var(--muted); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }

<script>
// ----- logo do restaurante no topo: a que o admin subiu no totem; se não tiver, a da pasta img; se nada, um selo "DL" -----
(async () => {
  const el = document.getElementById("logo-topo"); if (!el) return;
  let src = "";
  try { const d = ((await (await fetch("/api/config", { cache: "no-store" })).json()) || {}).dados || {}; if (d.logoPequena) { try { src = JSON.parse(d.logoPequena); } catch (e) { src = d.logoPequena; } } } catch (e) {}
  const tenta = (s) => new Promise((ok) => { if (!s) return ok(false); const i = new Image(); i.onload = () => ok(i.width > 0); i.onerror = () => ok(false); i.src = s; });
  for (const s of [src, "img/logo.png"]) if (await tenta(s)) { el.src = s; el.parentNode.classList.add("tem-img"); return; }
})();
const ehMarm = (p) => !!p && p.tipo === "balanca" && p.numero > 10000; // marmitex do totem que virou comanda (M33)
const ehDel = (p) => !!p && p.tipo === "delivery"; // pedido do site de delivery (D123), trazido pelo servidor
const nDel = (p) => (p.entrega === "retirada" ? "R" : "E") + p.numero; // delivery: E = entrega, R = retirada (cada um conta do 1 todo dia)
const curto = (p) => (ehDel(p) ? nDel(p) : p.tipo !== "balanca" ? "#" + p.numero : ehMarm(p) ? "M" + (p.numero - 10000) : "C" + p.numero);
const rotPed = (p) => (ehDel(p) ? (p.entrega === "retirada" ? "Retirada " : "Entrega ") + nDel(p) : p.tipo !== "balanca" ? "Pedido #" + p.numero : ehMarm(p) ? "Marmitex M" + (p.numero - 10000) : "Comanda " + p.numero);
const PAG_SITE = { conta: "Marcar na conta", pix: "Pix", dinheiro: "Dinheiro", cartao_entrega: "Cartão na entrega" };
const infoDel = (p) => { // endereço, telefone e como o cliente disse que vai pagar
  const e = p.endereco || {}, onde = p.entrega === "entrega" ? `🛵 ${esc([e.rua && e.rua + ", " + (e.numero || "s/n"), e.bairro, e.complemento].filter(Boolean).join(" - "))}` : "🏃 Retira na loja";
  const tel = p.telefone ? ` · 📞 ${esc(String(p.telefone).replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3"))}${p.whats === "sem" ? ` <b style="color:#c62828">⚠ número SEM WhatsApp: ligue pra confirmar</b>` : p.whats === "ok" ? " ✓ WhatsApp" : ""}` : "";
  const pg = p.pagPrevisto ? ` · ${p.status === "pago" ? "pagamento" : "vai pagar"}: <b>${esc(PAG_SITE[p.pagPrevisto] || p.pagPrevisto)}${p.cartaoTipo ? ({ debito: " (débito)", credito: " (crédito)", refeicao: " - refeição" })[p.cartaoTipo] : ""}</b>${p.trocoPara ? " (troco p/ " + brl(p.trocoPara) + ")" : ""}` : "";
  return `<p class="dl-info">${onde}${tel}${pg}${p.obsPedido ? `<br><i>Obs: ${esc(p.obsPedido)}</i>` : ""}</p>`;
};
const $ = (s) => document.querySelector(s);
const brl = (n) => "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); // R$ 8.036,16
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ===================== PERÍODO (Fechamento e Painel), BEBIDA, DETALHES =====================
let per = { modo: "dia", de: "", ate: "" }, cachePed = {}, cacheContas = {}, promPer = null, tsHoje = 0, abaPer = "", ultBarra = "", ultCorpo = "";
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };

const mesesEntre = (a, b) => { const r = []; let k = a.slice(0, 7); const fim = b.slice(0, 7); while (k <= fim && r.length < 18) { r.push(k); k = addDias(k + "-01", 32).slice(0, 7); } return r; };

function intervalo() { // [de, até] do período escolhido (semana = seg a dom; mês = mês inteiro da data de referência)
  if (per.modo === "semana") { const off = (new Date(dia + "T12:00:00").getDay() + 6) % 7, ini = addDias(dia, -off); return [ini, addDias(ini, 6)]; }
  if (per.modo === "mes") { const ds = diasDoMes(dia.slice(0, 7)); return [ds[0], ds[ds.length - 1]]; }
  if (per.modo === "pers") { let de = per.de || dia, ate = per.ate || dia; if (de > ate) { const t = de; de = ate; ate = t; } return [de, ate]; }
  return [dia, dia];
}
const pedsPer = () => (per.modo === "dia" ? pedidos : diasEntre(...intervalo()).flatMap((d) => cachePed[d] || []));
const contasPer = () => { const [a, b] = intervalo(), vistos = new Set(); return Object.values(cacheContas).flatMap((c) => (c && c.pagamentos) || []).filter((p) => p.data >= a && p.data <= b && !vistos.has(p.id) && vistos.add(p.id)); };

async function carregaPeriodo() {
  const [a, b] = intervalo(), hj = hojeISO(), velho = Date.now() - tsHoje > 2500;
  if (per.modo !== "dia") {
    const ds = diasEntre(a, b).filter((d) => !cachePed[d] || (d === hj && velho));
    for (let i = 0; i < ds.length; i += 6) await Promise.all(ds.slice(i, i + 6).map(async (d) => { try { const r = await aut("/api/pedidos?dia=" + d); if (r.ok) cachePed[d] = await r.json(); } catch (e) {} }));
    if (ds.includes(hj)) tsHoje = Date.now();
  }
  const ms = mesesEntre(mesAnterior(a), b).filter((m) => !cacheContas[m]); // pega também o mês anterior: pagamento de conta antiga feito dentro do período
  await Promise.all(ms.map(async (m) => { try { const r = await aut("/api/contas?mes=" + m); if (r.ok) cacheContas[m] = await r.json(); } catch (e) {} }));
}

// ===== FECHAMENTO DAS ENTREGAS (pedidos do site): quanto o motoboy traz em dinheiro, quanto passou no cartão, Pix e taxas =====
let entFil = "entrega", entBoy = ""; // entBoy: mostrando só as entregas desse motoboy ("__sem" = sem motoboy marcado)
const formaEnt = (p) => (p.pagPrevisto === "cartao_entrega" ? "cartao" : p.pagPrevisto || p.pagamento || "");
const taxaEnt = (p) => round2(soma(p.itens.filter((c) => c.tipo === "taxa"), (c) => c.preco * (c.qtd || 1)));
const trocoEnt = (p) => (formaEnt(p) === "dinheiro" && p.trocoPara > p.valor ? round2(p.trocoPara - p.valor) : 0);
function resumoEntregas() {
  const ds = pedidos.filter((p) => p.tipo === "delivery"), canc = ds.filter((p) => p.status === "cancelado");
  const sel = ds.filter((p) => p.status !== "cancelado" && (entFil === "todos" || (p.entrega || "entrega") === entFil)).sort((a, b) => a.quando - b.quando);
  const por = (f) => round2(soma(sel.filter((p) => formaEnt(p) === f), (p) => p.valor));
  return { ds, canc, sel, din: por("dinheiro"), car: por("cartao"), pix: por("pix"), troco: round2(soma(sel, trocoEnt)), taxas: round2(soma(sel, taxaEnt)), total: round2(soma(sel, (p) => p.valor)) };
}

// ----- cabeçalho: LOGO NO CANTO SUPERIOR ESQUERDO + nome do restaurante do lado -----
function cabecalhoESC(img, dots, tel) { // tel: 3ª linha (telefone), só no comprovante do cliente

  }

  const fonte = (s) => (g.font = `bold ${s}px Georgia, "Times New Roman", serif`);
  fonte(fs); while (g.measureText("DA L\u00daCIA").width > larg && fs > 16) fonte((fs -= 2));
  g.fillText("DA L\u00daCIA", x, H * (tel ? 0.3 : 0.4));
  let fs2 = Math.round(fs * 0.5); g.font = `${fs2}px Arial, sans-serif`; while (g.measureText("Cantina & Restaurante").width > larg && fs2 > 10) g.font = `${--fs2}px Arial, sans-serif`;
  g.fillText("Cantina & Restaurante", x, H * (tel ? 0.6 : 0.73));
  if (tel) g.fillText(tel, x, H * 0.85);

  const preto = new Uint8Array(dots * H);
  for (let y = 0; y < H; y++) for (let xx = 0; xx < dots; xx++) {
    const i = y * dots + xx, v = cinza[i];
    if (xx >= x) { preto[i] = v < 140 ? 1 : 0; continue; }
    const novo = v < 128 ? 0 : 255, err = v - novo; preto[i] = novo === 0 ? 1 : 0;
    if (xx + 1 < x) cinza[i + 1] += (err * 7) / 16;
    if (y + 1 < H) { if (xx > 0) cinza[i + dots - 1] += (err * 3) / 16; cinza[i + dots] += (err * 5) / 16; if (xx + 1 < x) cinza[i + dots + 1] += err / 16; }

}

    <label class="cf" id="cf-preco" ${e.modo === "refeicao" ? "" : "hidden"}>Valor de cada refeição<input id="c-preco" inputmode="decimal" placeholder="Ex.: 22,00" value="${e.valorRefeicao ? String(e.valorRefeicao).replace(".", ",") : ""}"></label>
    <div class="cf" id="cf-pag" ${e.empresa ? "hidden" : ""}>Pagamento<input type="hidden" id="c-pag" value="${e.pagamento === "depois" ? "depois" : "antecipado"}"><div class="ct-seg cf-seg" data-campo="c-pag"><button class="btn ${e.pagamento !== "depois" ? "on" : ""}" data-a="cfSeg" data-v="antecipado">Paga antecipado</button><button class="btn ${e.pagamento === "depois" ? "on" : ""}" data-a="cfSeg" data-v="depois">Paga depois (fiado)</button></div></div>
    <label class="cf">Telefone / WhatsApp<input id="c-tel" inputmode="tel" value="${esc(e.telefone || "")}" placeholder="(12) 99999-9999"></label>
    <label class="cf">Endereço de entrega <small>(o robô do WhatsApp usa na marmita, sem perguntar toda vez)</small><input id="c-end" value="${esc(e.endereco || "")}" placeholder="Ex.: Rua das Flores, 25, Centro, apto 3" maxlength="200"></label>
    ${id ? `<button class="btn cf-arq" data-a="cliJuntar" data-c="${id}">🔀 Cadastro repetido? Juntar com outro cliente</button><button class="btn ruim cf-arq" data-a="cliArq" data-c="${id}">🗃 Arquivar cliente</button>` : ""}</div>
    <div class="acoes cm-rodape"><button class="btn" data-a="fechar">Cancelar</button><button class="btn ok" data-a="cliSalvar" data-c="${id || ""}">${id ? "Salvar" : "Adicionar cliente"}</button></div>`);
  const n = $("#c-nome"); if (n && !id) setTimeout(() => n.focus(), 50);
  checaDup(id);
}
function checaDup(id) { const el = $("#c-dup"), n = normN(($("#c-nome") || {}).value || ""); if (!el) return; const d = n && clientes.find((c) => c.id !== id && normN(c.nome) === n); el.hidden = !d; if (d) el.textContent = `⚠ Já existe um cliente “${d.nome}”${d.empresa ? " (" + d.empresa + ")" : ""}${d.ativo === false ? " arquivado" : ""}. Confira se não é a mesma pessoa.`; }
document.addEventListener("input", (e) => {
  if (e.target.id === "cli-busca") { cliBusca = e.target.value; filtrarClientes(); }
  else if (e.target.id === "c-nome") checaDup(($('[data-a="cliSalvar"]') || { dataset: {} }).dataset.c || null);
  else if (e.target.id === "c-emp") { const p = $("#cf-pag"); if (p) p.hidden = !!e.target.value.trim(); }
});
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-a]"); if (!t) return; const d = t.dataset, a = d.a;
  if (a === "cliFiltro") { cliFiltro = d.f; desenharClientes(); }
  else if (a === "cliNovo") modalCliente(null, d.emp);
  else if (a === "cliEditar") modalCliente(d.c);
  else if (a === "cliConta") { mes = hojeISO().slice(0, 7); contaAberta = d.k; aba = "contas"; desenhar(); window.scrollTo(0, 0); }
  else if (a === "cfSeg") { const box = t.closest(".cf-seg"); box.querySelectorAll(".btn").forEach((b) => b.classList.toggle("on", b === t)); $("#" + box.dataset.campo).value = d.v; if (box.dataset.campo === "c-modo") $("#cf-preco").hidden = d.v !== "refeicao"; }
  else if (a === "cliSalvar") {
    const nome = $("#c-nome").value.trim(); if (!nome) return alert("Digite o nome.");
    const b = { nome, empresa: $("#c-emp").value.trim(), modo: $("#c-modo").value, valorRefeicao: num("#c-preco") || 0, pagamento: $("#c-pag").value, telefone: $("#c-tel").value.trim(), endereco: ($("#c-end") || { value: "" }).value.trim() };
    if (b.modo === "refeicao" && !(b.valorRefeicao > 0)) return alert("Informe o valor de cada refeição.");
    try { await api(d.c ? "PUT" : "POST", "/api/clientes" + (d.c ? "/" + d.c : ""), b); } catch (err) { return; }
    $("#modal").hidden = true; await carregarClientes(); desenharClientes(); avisoImp(d.c ? "✓ Cliente salvo" : "✓ Cliente adicionado", "ok");
  }
  else if (a === "cliArq") { if (!confirm("Arquivar este cliente? Ele some das listas, mas o histórico continua guardado (dá pra reativar depois).")) return; await api("PUT", "/api/clientes/" + d.c, { ativo: false }); $("#modal").hidden = true; await carregarClientes(); desenharClientes(); }
  else if (a === "cliJuntar") { // tudo que foi marcado neste cliente passa pro escolhido, e este cadastro some
    const de = clientes.find((x) => x.id === d.c); if (!de) return;
    escolherCliente(async (para) => {
      if (!para || para.id === de.id) return;
      if (!confirm(`Passar tudo de “${de.nome}” para “${para.nome}${para.empresa ? " (" + para.empresa + ")" : ""}” e apagar “${de.nome}”?

Isso não dá pra desfazer.`)) return;
      try { const r = await api("POST", "/api/clientes/" + de.id + "/juntar", { para: para.id }); avisoImp(`✓ ${r.lancamentos} lançamento(s) passaram para ${para.nome}`, "ok"); } catch (err) { return; }
      await carregarClientes(); if (aba === "contas") recarregar(); else desenharClientes();
    }, null, "");
  }
  else if (a === "cliReat") { await api("PUT", "/api/clientes/" + d.c, { ativo: true }); await carregarClientes(); desenharClientes(); avisoImp("✓ Cliente reativado", "ok"); }
  // gaveta
  else if (a === "gAvisoOk") { const el = $("#aviso-gav"); if (el) el.remove(); }
  else if (a === "gTrocoAbre") abrirModal(`<div class="cm-corpo"><h2>Corrigir troco inicial<small>Quanto tinha na gaveta quando o dia começou?</small></h2><div class="pg-valor"><span>R$</span><input id="g-troco" inputmode="decimal" value="${gaveta && gaveta.abertura ? gaveta.abertura.valor.toFixed(2).replace(".", ",") : ""}"></div></div><div class="acoes cm-rodape"><button class="btn" data-a="fechar">Cancelar</button><button class="btn ok" data-a="gTrocoSalva">Salvar troco</button></div>`);
  else if (a === "gTrocoSalva") { const v = num("#g-troco"); if (!(v >= 0)) return alert("Digite o troco."); $("#modal").hidden = true; try { gaveta = await api("POST", "/api/gaveta", { acao: "troco", valor: v }); } catch (err) { return; } const el = $("#aviso-gav"); if (el) el.remove(); if (aba === "gaveta") desenharGaveta(); avisoImp("✓ Troco corrigido para " + brl(v), "ok"); }
  else if (a === "gTipo") { $("#g-tipo").value = d.t; t.parentNode.querySelectorAll(".btn").forEach((b) => b.classList.toggle("on", b === t)); }
});

// ----- atalhos do caixa: doces, juntar comandas, Enter na busca -----
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]"); if (!t) return; const d = t.dataset, a = d.a, A = acerto;
  if (a === "juntaSel") { if (juntar.has(d.id)) juntar.delete(d.id); else juntar.add(d.id); ultimoHtml = ""; desenhar(); }
  else if (a === "juntaLimpa") { juntar.clear(); ultimoHtml = ""; desenhar(); }
  else if (a === "juntaRec") abrirAcerto([...juntar]);
  else if (!A) return;
  else if (a === "acJunta") acJuntar();
  else if (a === "acTira") { if (A.ps.length < 2) return; const p = A.ps.find((x) => x.id === d.id); A.ps = A.ps.filter((x) => x.id !== d.id); if (p) p.itens.forEach((c) => delete A.itens[kIt(p, c)]); atualizarAcerto(); }
  else if (a === "acRap") { $("#ac-rec").value = Number(d.v).toFixed(2).replace(".", ","); atualizarAcerto(); }
  else if (a === "dcAbrir" || a === "dcFechar") { A.picker = a === "dcAbrir" ? !A.picker : false; atualizarAcerto(); if (A.picker) { const b = $("#dc-busca"); if (b) { b.focus(); b.select(); } } }
  else if (a === "dcCat") { A.cat = d.k; try { localStorage.setItem("cxDcCat", d.k); } catch (e) {} desenharPicker(); }
  else if (a === "dcAdd") { const prod = catalogo().find((x) => x.nome === d.n); if (!prod) return; addDc(prod); atualizarAcerto(); }
  else if (a === "dcMais" || a === "dcMenos") { const x = A.doces[d.n]; if (!x) return; x.qtd += a === "dcMais" ? 1 : -1; if (x.qtd <= 0) delete A.doces[d.n]; atualizarAcerto(); }
  else if (a === "dcAvulso") {
    const v = parseFloat(($("#dc-val").value || "").replace(",", ".")); if (!(v > 0)) return alert("Digite o valor do item.");
    let nome = $("#dc-nome").value.trim() || "Doce avulso"; if (A.doces[nome] && A.doces[nome].preco !== v) nome += " " + brl(v);
    const x = A.doces[nome] || (A.doces[nome] = { nome, preco: v, qtd: 0, forma: A.padrao, tipo: "doce" }); x.qtd++; $("#dc-nome").value = $("#dc-val").value = ""; atualizarAcerto();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ac-rec") atualizarAcerto();
  else if (e.target.id === "dc-busca" && acerto) { acerto.q = e.target.value; desenharPicker(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "busca") { // digitou o nº ou nome + Enter: já abre o pagamento
    const q = e.target.value.trim().toLowerCase().replace("#", ""); if (!q) return;
    const ach = pedidos.filter((p) => p.status === "aguardando" && p.itens.some((c) => !c.pago) && casaBusca(p, q)), ex = ach.filter((p) => String(p.numero) === q || String(p.numeroLocal) === q), alvo = ach.length === 1 ? ach[0] : ex.length === 1 ? ex[0] : null;
    if (alvo) { e.target.blur(); abrirAcerto([alvo.id]); } else { e.target.style.outline = "3px solid #a50f14"; setTimeout(() => (e.target.style.outline = ""), 700); }
  } else if (e.target.id === "ac-junta") acJuntar();
  else if (e.target.id === "dc-busca" && acerto) { const r = filtraDc(acerto.cat, e.target.value); if (r.length === 1) { addDc(r[0]); e.target.value = ""; acerto.q = ""; atualizarAcerto(); } }
});
// painel do Receber aberto: F1 a F5 = Dinheiro, Pix, Crédito, Débito, Refeição (o F5 não recarrega a página enquanto ele está aberto); Esc fecha
document.addEventListener("keydown", (e) => {
  const m = $("#modal"); if (!acerto || !m || m.hidden || !m.classList.contains("lado")) return;
  const n = /^F([1-5])$/.exec(e.key);
  if (n) { e.preventDefault(); if (acerto.duas) return; const b = document.querySelector(`.ac-tile[data-f="${FORMAS_PAG[+n[1] - 1]}"]`); if (b) b.click(); return; }
  if (e.key === "Escape" && $("#ac-picker:not([hidden])")) { e.preventDefault(); const f = $("#ac-picker .dc-pronto"); if (f) f.click(); }
  else if (e.key === "Escape" && !$("#ac-picker:not([hidden]) input:focus")) { e.preventDefault(); const f = m.querySelector('.ac-x[data-a="fechar"]'); if (f) f.click(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id !== "ac-imp") return;
  try { localStorage.setItem("cxImpAuto", e.target.checked ? "1" : "0"); } catch (x) {}
  if (acerto) atualizarAcerto();
});
</script>
