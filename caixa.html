<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caixa - Da Lúcia</title><link rel="manifest" href="manifest-caixa.json"><meta name="theme-color" content="#A50F14">
<style>
:root { --laranja: #FFA500; --vermelho: #A50F14; --verm-esc: #7d0a0e; --lar-esc: #FF8A00; --creme: #FFF6E8; --tinta: #2B1710; --sombra: 0 10px 30px rgba(120,50,10,.14); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Inter, Arial, sans-serif; color: var(--tinta); min-height: 100vh; background: radial-gradient(1100px 560px at 8% -10%, #fff 0, transparent 60%), var(--creme); }
header { background: linear-gradient(135deg, var(--vermelho), var(--verm-esc)); color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 16px; box-shadow: var(--sombra); }
header h1 { flex: 1; font: 700 1.5rem Georgia, serif; } .lg { width: 48px; height: 48px; border-radius: 50%; }
#status { font-size: .85rem; background: rgba(255,255,255,.2); padding: 6px 14px; border-radius: 999px; }
nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 16px 28px 8px; }
.btn { padding: 12px 20px; border: 0; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; background: #fff; color: var(--tinta); box-shadow: 0 2px 8px rgba(120,50,10,.1); transition: transform .15s, box-shadow .2s; }
.btn:active { transform: scale(.96); } .btn:disabled { opacity: .4; }
.btn.on { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; }
.btn.ok { background: linear-gradient(135deg, #1f9a45, #16793a); color: #fff; box-shadow: 0 8px 18px rgba(26,127,55,.3); }
.btn.ruim { color: var(--vermelho); border: 2px solid var(--vermelho); box-shadow: none; }
input, select { padding: 12px 14px; font-size: 1rem; border: 2px solid transparent; border-radius: 14px; box-shadow: var(--sombra); outline: 0; transition: all .2s; }
input:focus { border-color: var(--laranja); box-shadow: 0 0 0 6px rgba(255,165,0,.25); }
main { max-width: 1000px; margin: 0 auto; padding: 12px 28px 40px; }
.card { background: #fff; border-radius: 24px; padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--sombra); border-left: 8px solid var(--laranja); animation: sobe .35s backwards; }
.card .topo { display: flex; gap: 14px; align-items: baseline; } .nome { flex: 1; font-weight: 700; font-size: 1.1rem; }
.num { font: 700 1.8rem Georgia, serif; color: var(--vermelho); } .valor { font: 700 1.4rem Georgia, serif; }
.card ul { margin: 8px 0 8px 18px; font-size: .92rem; line-height: 1.5; } .acoes { display: flex; gap: 10px; margin-top: 10px; } .pg { margin-top: 8px; font-size: .9rem; }
.vazio, .dica { color: #8a6f60; margin: 24px 0; text-align: center; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
.cards div { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; border-radius: 22px; padding: 16px; box-shadow: var(--sombra); } .cards b { display: block; font: 700 1.6rem Georgia, serif; }
h3 { margin: 18px 0 8px; font-family: Georgia, serif; }
table { width: 100%; background: #fff; border-collapse: separate; border-radius: 18px; box-shadow: var(--sombra); margin: 10px 0; overflow: hidden; } td { padding: 12px; border-bottom: 1px solid #f1e6da; }
.modal { position: fixed; inset: 0; background: rgba(43,23,16,.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; } .modal[hidden] { display: none; }
.caixa-modal { background: #fff; padding: 26px; border-radius: 30px; width: min(440px, 94vw); box-shadow: 0 18px 44px rgba(0,0,0,.3); animation: sobe .3s backwards; }
.formas { display: flex; gap: 8px; margin: 16px 0; } .formas .btn { flex: 1; } #troco { margin-bottom: 12px; font-size: 1.1rem; }
#gate { max-width: 340px; margin: 90px auto; text-align: center; background: #fff; padding: 30px; border-radius: 30px; box-shadow: var(--sombra); }
#gate input { width: 100%; margin: 16px 0; text-align: center; font-size: 1.5rem; }
@keyframes sobe { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.largo { max-width: none !important; }
.gradewrap { overflow: auto; max-height: calc(100vh - 270px); background: #fff; border-radius: 18px; box-shadow: var(--sombra); margin-top: 12px; }
table.grade { border-collapse: separate; border-spacing: 0; font-size: .9rem; width: max-content; min-width: 100%; box-shadow: none; border-radius: 0; margin: 0; }
.grade th, .grade td { padding: 8px 10px; border-bottom: 1px solid #f1e6da; border-right: 1px solid #f6efe7; text-align: center; white-space: nowrap; }
.grade thead th { position: sticky; top: 0; background: var(--laranja); color: #fff; z-index: 2; } .grade th small { display: block; font-weight: 400; opacity: .9; }
.grade .dia { position: sticky; left: 0; background: #fff7ee; text-align: left; z-index: 1; font-weight: 700; } .grade thead .dia { background: var(--vermelho); z-index: 3; }
.grade th a { cursor: pointer; text-decoration: underline; } .grade .cel { cursor: pointer; } .grade .cel:hover { background: #FFE3A8; }
.grade tr.dom td { background: #f3ede6; color: #9a7b66; } .grade tr.tot td { background: #fff2b8; font-weight: 700; } .grade tr.saldo td { background: #FFE3A8; font-weight: 700; }
.grade tr.st td { background: #e9f6ec; white-space: normal; min-width: 140px; font-size: .8rem; }
.mini { padding: 6px 10px !important; font-size: .8rem !important; border-radius: 10px !important; margin-top: 4px; }
.lista-cli { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; margin: 10px 0; } .lista-cli .btn { text-align: left; }
.caixa-modal input, .caixa-modal select { margin: 3px 0; } .caixa-modal h4 { margin: 12px 0 4px; } .caixa-modal p { margin: 6px 0; }
.rel-topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .rel-topo label { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.grade td.alerta { background: #fde0e0 !important; color: var(--vermelho); font-weight: 700; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 170px; background: #fff; border-radius: 18px; padding: 14px 14px 8px; box-shadow: var(--sombra); margin: 10px 0 16px; }
.barra-h { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: .72rem; color: #8a6f60; }
.barra-h i { display: block; width: 100%; min-height: 2px; background: linear-gradient(180deg, var(--laranja), var(--lar-esc)); border-radius: 6px 6px 0 0; } .barra-h b { color: var(--tinta); font-size: .7rem; }
.rank-p { display: flex; align-items: center; gap: 10px; padding: 5px 0; } .rank-p span { width: 38%; } .rank-p i { height: 14px; background: var(--laranja); border-radius: 7px; } .rank-p b { margin-left: 4px; }
.extrato { background: #fffdf7; border: 1px dashed #cdbba8; border-radius: 12px; padding: 14px; font: .9rem/1.5 "Courier New", monospace; white-space: pre-wrap; max-height: 52vh; overflow: auto; }
@media print { header, nav, #lista, #gate, .acoes, .tk-x, #tec { display: none !important; } .modal { position: static !important; background: none !important; backdrop-filter: none !important; display: block !important; } .caixa-modal { box-shadow: none !important; max-height: none !important; width: auto !important; } .extrato { max-height: none; border: 0; } }
.ac-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
#ac-itens { max-height: 38vh; overflow-y: auto; }
.ac-item { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: #f7f1ea; margin-bottom: 6px; }
.ac-item.on { background: #fff3da; outline: 2px solid var(--laranja); }
.ac-chk { min-height: 0; padding: 4px 10px; font-size: 1.3rem; border: 0; background: transparent; }
.ac-nome small { display: block; color: #8a6f60; font-weight: 400; } .ac-formas { grid-column: 1 / -1; display: flex; gap: 6px; } .ac-formas .btn.on { background: var(--vermelho); color: #fff; }
.ac-chip { display: inline-block; background: #e9f6ec; color: #16793a; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; margin-left: 4px; } .ac-chip.falta { background: #fde0e0; color: var(--vermelho); }
li.pago { opacity: .7; } .caixa-modal:has(#ac-itens) { width: min(640px, 96vw); }

/* ================= VISUAL NOVO (etapa 1: tela principal) ================= */
:root { --bege: #F6E9D8; --bege-esc: #EAD7BF; --muted: #8a6f60; --verde: #1f9a45; --sombra-sm: 0 1px 2px rgba(80,35,10,.08), 0 3px 10px rgba(120,50,10,.08); --sombra: 0 1px 2px rgba(80,35,10,.06), 0 8px 24px rgba(120,50,10,.10); }
body { background: radial-gradient(900px 480px at 0% -8%, #fff 0, transparent 62%), radial-gradient(700px 400px at 100% 100%, #ffe9c9 0, transparent 60%), var(--creme); background-attachment: fixed; }

/* topo (fica fixo ao rolar) */
.topo-fixo { position: sticky; top: 0; z-index: 20; }
header { padding: 12px 28px; border-bottom: 3px solid var(--laranja); box-shadow: 0 4px 18px rgba(125,10,14,.30); }
header h1 { letter-spacing: .2px; } .lg { width: 44px; height: 44px; border: 2px solid rgba(255,255,255,.35); }
#status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.18); padding: 7px 14px; }
#status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #4ee07f; box-shadow: 0 0 0 3px rgba(78,224,127,.25); }
#status.off { background: #ffe1e1; color: var(--vermelho); font-weight: 700; border-color: transparent; } #status.off::before { background: var(--vermelho); box-shadow: 0 0 0 3px rgba(165,15,20,.2); }
header .btn.mini { width: 44px; height: 44px; margin: 0; padding: 0 !important; display: grid; place-items: center; background: rgba(255,255,255,.14); color: #fff; box-shadow: none; border: 0; font-size: 1.15rem !important; border-radius: 14px !important; }
header .btn.mini:active { background: rgba(255,255,255,.3); }

/* abas em cápsula + busca */
nav { flex-wrap: wrap; gap: 10px 14px; padding: 12px 28px; background: rgba(255,246,232,.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(234,215,191,.7); }
.abas { display: flex; gap: 4px; padding: 5px; background: var(--bege); border-radius: 999px; overflow-x: auto; flex: 1 1 max-content; min-width: 0; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas .btn { flex-shrink: 0; min-height: 0; padding: 10px 16px; background: transparent; box-shadow: none; border: 0; border-radius: 999px; color: #7a5a48; white-space: nowrap; }
.abas .btn.on { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); color: #fff; box-shadow: 0 4px 12px rgba(255,140,0,.35); }
.filtros { display: flex; gap: 10px; flex: 0 0 auto; margin-left: auto; }
#busca { width: 210px; } #dia { width: 160px; }
@media (max-width: 1100px) { .abas, .filtros { flex: 1 1 100%; } #busca { flex: 1; width: auto; } }

/* botões e campos */
.btn { border: 1px solid var(--bege-esc); }
.btn.ok, .btn.on { border-color: transparent; }
.btn.ok { box-shadow: 0 8px 18px rgba(26,127,55,.28), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.ruim { border: 2px solid var(--vermelho); background: #fff; }
input, select { border: 2px solid var(--bege-esc); background: #fff; box-shadow: var(--sombra-sm); }
input:focus, select:focus { border-color: var(--laranja); box-shadow: 0 0 0 5px rgba(255,165,0,.22); }

/* lista de pedidos em grade */
main { max-width: 1400px; padding: 16px 28px 50px; }
.pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start; }
.pedidos .card { margin-bottom: 0; }
.vazio-box { display: grid; place-items: center; gap: 6px; padding: 70px 20px; color: var(--muted); font-weight: 600; } .vazio-box span { font-size: 2.6rem; opacity: .55; }

/* card do pedido */
.card { border-radius: 24px; padding: 18px 20px; border: 1px solid rgba(234,215,191,.6); border-left: 8px solid var(--laranja); }
.card.st-pago { border-left-color: var(--verde); } .card.st-conta { border-left-color: #c9852b; } .card.st-cancelado { border-left-color: #b5a79b; background: #fbf8f4; }
.card .topo { display: flex; gap: 10px 12px; align-items: center; flex-wrap: wrap; }
.card .topo .num { font: 700 1.15rem Georgia, serif; background: var(--vermelho); color: #fff; padding: 6px 12px; border-radius: 12px; min-width: 50px; text-align: center; }
.card .topo small { background: var(--bege); color: #7a5a48; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .75rem; }
.card .nome { flex: 1 1 110px; min-width: 0; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .hora { color: var(--muted); font-size: .85rem; font-weight: 600; }
.card .valor { font: 700 1.5rem Georgia, serif; font-variant-numeric: tabular-nums; }
.card ul { list-style: none; margin: 12px 0 4px; padding: 0; font-size: .95rem; line-height: 1.4; }
.card li { padding: 8px 0; border-top: 1px dashed #eadccb; } .card li:first-child { border-top: 1px solid #f1e6da; }
.card li i { color: var(--muted); } .it-p { float: right; margin-left: 12px; font-variant-numeric: tabular-nums; }
.card .acoes { gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.card .acoes .btn { flex: 1; min-height: 50px; padding: 10px 14px; white-space: nowrap; } .card .acoes .btn.ok { flex: 1.5; }
.pg { margin-top: 10px; padding: 10px 12px; background: #fff8ec; border-radius: 12px; line-height: 1.7; }
.st-pago .pg { background: #f3faf5; color: #2c6b43; }

/* janelas e login */
.caixa-modal { border-top: 6px solid var(--vermelho); } .caixa-modal h2 { font: 700 1.4rem Georgia, serif; }
#gate { border-top: 6px solid var(--vermelho); } #gate h2 { font: 700 1.5rem Georgia, serif; }

/* ================= JANELA DO RECEBER (etapa 2) ================= */
.caixa-modal:has(#ac-itens) { display: flex; flex-direction: column; padding: 0; overflow: hidden; width: min(740px, 96vw); max-height: 92vh; }
body.tec-on .caixa-modal:has(#ac-itens) { max-height: calc(100vh - var(--tec-h, 0px) - 20px); }
.caixa-modal:has(#ac-itens) h2 { flex-shrink: 0; padding: 22px 26px 4px; }
.ac-head { flex-shrink: 0; padding: 0 26px 14px; border-bottom: 1px solid var(--bege); }
.ac-head .dica { margin: 2px 0 12px; text-align: left; font-size: .88rem; color: var(--muted); line-height: 1.35; }
.ac-top { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin: 0; }
.ac-seg { display: flex; gap: 2px; padding: 4px; background: var(--bege); border-radius: 999px; }
.ac-seg .btn { min-height: 0; padding: 9px 16px; border: 0; border-radius: 999px; background: transparent; box-shadow: none; color: #7a5a48; font-size: .9rem; }
.ac-seg .btn:active { background: #fff; }
.ac-todos { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .ac-todos > span { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.ac-todos .btn { min-height: 42px; padding: 8px 14px; border-radius: 12px; font-size: .9rem; }
#ac-itens { flex: 1; min-height: 0; max-height: none; overflow-y: auto; overscroll-behavior: contain; padding: 14px 26px 6px; }
#ac-itens > .dica { text-align: left; color: var(--muted); font-size: .85rem; }
.ac-item { grid-template-columns: auto 1fr auto auto; gap: 8px 14px; padding: 12px 14px; margin-bottom: 10px; border-radius: 18px; background: #fbf7f2; border: 2px solid transparent; outline: 0; transition: background .15s, border-color .15s; }
.ac-item.on { background: #fff8ea; border-color: var(--laranja); outline: 0; }
.ac-chk { width: 34px; height: 34px; min-height: 0; padding: 0; display: grid; place-items: center; border: 2px solid var(--bege-esc); border-radius: 10px; background: #fff; color: #fff; font-size: 1.1rem; font-weight: 700; box-shadow: none; }
.ac-chk.on { background: var(--verde); border-color: var(--verde); }
.ac-nome b { font-size: 1rem; line-height: 1.25; } .ac-val { font: 700 1.1rem Georgia, serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ac-formas { grid-column: auto; display: flex; gap: 6px; }
.ac-formas .btn { min-height: 42px; padding: 8px 12px; border-radius: 12px; font-size: .88rem; white-space: nowrap; }
.ac-formas .btn.on { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
.ac-formas .btn:disabled { opacity: .4; }
@media (max-width: 640px) { .ac-item { grid-template-columns: auto 1fr auto; } .ac-formas { grid-column: 1 / -1; } .ac-formas .btn { flex: 1; } }
.ac-rodape { flex-shrink: 0; padding: 14px 26px 0; border-top: 1px solid var(--bege); background: #fff; }
.ac-linha { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.ac-tot small, .ac-aberto small { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
.ac-tot b { font: 700 1.8rem Georgia, serif; color: var(--verde); font-variant-numeric: tabular-nums; }
.ac-aberto { margin-left: auto; text-align: right; } .ac-aberto b { font: 700 1.1rem Georgia, serif; color: #7a5a48; }
.ac-chips { display: flex; gap: 6px; flex-wrap: wrap; } .ac-chip { margin-left: 0; }
.ac-din { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 14px; background: #f3faf5; border-radius: 14px; color: #2c6b43; font-weight: 700; }
.ac-din[hidden] { display: none; } .ac-din > span { flex: 1; } .ac-din input { width: 150px; text-align: right; font-weight: 700; } #ac-tr { min-width: 120px; text-align: right; font-size: 1.05rem; }
.caixa-modal:has(#ac-itens) .acoes { flex-shrink: 0; margin: 0; padding: 14px 26px 20px; gap: 12px; background: #fff; }
.caixa-modal:has(#ac-itens) .acoes .btn { min-height: 58px; border-radius: 16px; font-size: 1.05rem; }
.caixa-modal:has(#ac-itens) .acoes .btn:first-child { flex: 1; } #ac-ok { flex: 2; font-size: 1.15rem !important; }
#ac-ok:disabled { background: #d9c9bd; box-shadow: none; opacity: 1; color: #fff9f2; }

/* ================= ETAPA 3: sem animação a cada atualização + Contas ================= */
.card { animation: none; }

/* cartões de resumo (Contas, Fechamento, Painel) */
.cards > div { background: #fff; color: #7a5a48; font-size: .85rem; font-weight: 600; border: 1px solid rgba(234,215,191,.6); border-top: 5px solid var(--laranja); box-shadow: var(--sombra); }
.cards b { color: var(--vermelho); font-size: 1.7rem; }
.cards small { color: var(--muted); font-weight: 500; }
.cards > div.dev { border-top-color: var(--vermelho); } .cards > div.ok { border-top-color: var(--verde); } .cards > div.ok b { color: var(--verde); }

/* barra de filtros da aba Contas */
.rel-topo { background: #fff; border: 1px solid rgba(234,215,191,.6); border-radius: 22px; padding: 12px 16px; box-shadow: var(--sombra); gap: 12px 16px; }
.rel-topo label { font-size: .9rem; color: #7a5a48; }
.rel-topo input[type=month], .rel-topo select { min-height: 44px; padding: 8px 12px; background: var(--creme); box-shadow: none; }
.rel-topo label:has(#todos) { cursor: pointer; background: var(--bege); padding: 10px 14px; border-radius: 999px; font-weight: 600; }
.rel-topo .btn { min-height: 46px; } .rel-topo [data-a="novoLanc"] { margin-left: auto; }

/* grade de contas */
.gradewrap { border: 1px solid rgba(234,215,191,.6); border-radius: 22px; max-height: calc(100vh - 350px); min-height: 300px; }
.grade { font-size: .92rem; } .grade th, .grade td { padding: 10px 12px; }
.grade thead th { background: linear-gradient(135deg, var(--laranja), var(--lar-esc)); padding: 12px; }
.grade thead .dia { background: linear-gradient(135deg, var(--vermelho), var(--verm-esc)); }
.grade .dia { box-shadow: 3px 0 8px rgba(120,50,10,.08); }
.grade tbody tr:not(.dom):not(.tot):not(.saldo):not(.st):nth-child(even) td:not(.dia) { background: #fffaf4; }
.grade .cel:not(:empty) { background: #fff3d6 !important; color: #7a3b00; font-weight: 700; }
.grade .cel:hover { background: #FFE3A8 !important; }
.grade tr.dom td { background: #f3ede6 !important; }
.grade tr.saldo td { font-size: 1rem; }
.grade tr.st td { background: #eef8f0; padding: 12px; line-height: 1.5; }
.grade td .btn.mini { margin-top: 6px; }

/* janela: em qual cliente marcar? */
.caixa-modal:has(#lista-cli) { display: flex; flex-direction: column; padding: 0; overflow: hidden; width: min(540px, 94vw); max-height: 90vh; }
body.tec-on .caixa-modal:has(#lista-cli) { max-height: calc(100vh - var(--tec-h, 0px) - 20px); }
.caixa-modal:has(#lista-cli) h2 { flex-shrink: 0; padding: 22px 26px 12px; }
.cli-busca { flex-shrink: 0; padding: 0 26px 10px; } .cli-busca input { width: 100%; margin: 0; }
.lista-cli { flex: 1; min-height: 80px; max-height: none; margin: 0; padding: 4px 26px 10px; gap: 8px; overflow-y: auto; overscroll-behavior: contain; }

<body>
<div id="gate"><h2>Caixa - Da Lúcia</h2><input id="pin" type="password" inputmode="numeric" placeholder="Senha do caixa"><button class="btn ok" id="entrar">Entrar</button></div>
<div id="app" hidden>
  <div class="topo-fixo"><header><img class="lg" src="img/logo.png" alt="" onerror="this.remove()"><h1>Caixa - Da Lúcia</h1><span id="status">...</span><button class="btn mini" data-a="parado" id="btn-parado" title="Aviso de pedido parado">⏱</button><button class="btn mini" data-a="somCx" id="som-cx" title="Som de pedido novo">🔔</button></header>
  <nav>
    <div class="abas"><button class="btn" data-aba="aberto">Em aberto (<span id="n-aberto">0</span>)</button><button class="btn" data-aba="pagos">Pagos</button>
    <button class="btn" data-aba="conta">Na conta</button><button class="btn" data-aba="cancelados">Cancelados</button><button class="btn" data-aba="fechamento">Fechamento</button><button class="btn" data-aba="painel">📈 Painel</button><button class="btn" data-aba="gaveta">💵 Gaveta</button><button class="btn" data-aba="contas">📒 Contas</button><button class="btn" data-aba="clientes">👥 Clientes</button></div>
    <div class="filtros"><input id="busca" placeholder="🔍 Buscar nº ou nome"><input id="dia" type="date"></div>
  </nav></div>
  <main id="lista"></main>
</div>
<div id="modal" class="modal" hidden></div>
<script src="dados.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const brl = (n) => "R$" + n.toFixed(2).replace(".", ",");
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hora = (t) => new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const FORMAS = { dinheiro: "Dinheiro", pix: "Pix", cartao: "Cartão" };
let pedidos = [], aba = "aberto", dia = new Date().toLocaleDateString("en-CA"), sel = null;

const aut = async (url, opt = {}) => { // toda chamada leva a senha (token) do caixa; se o servidor disser que expirou, volta pro login
  const r = await fetch(url, { ...opt, headers: { ...(opt.headers || {}), Authorization: "Bearer " + (sessionStorage.getItem("caixaToken") || "") } });
  if (r.status === 401) { sessionStorage.removeItem("caixaToken"); location.reload(); }
  return r;
};
async function entrar() {
  const pin = $("#pin").value.trim(); if (!pin) return;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: "caixa", pin }) }), j = await r.json().catch(() => ({}));
    if (r.ok) { sessionStorage.setItem("caixaToken", j.token); iniciar(); return; }
    $("#pin").value = ""; $("#pin").placeholder = r.status === 429 ? "Muitas tentativas. Aguarde." : "Senha incorreta";
  } catch (e) { $("#pin").value = ""; $("#pin").placeholder = "Sem conexão com o servidor"; }
}
function iniciar() { $("#gate").hidden = true; $("#app").hidden = false; $("#dia").value = dia; carregarClientes().then(() => carregar()); setInterval(carregar, 3000); avisoPadrao(); }
let carregando = false, ultimoHtml = ""; // guarda o último desenho: se nada mudou, não redesenha
function pintar(h) { if (h === ultimoHtml) return; ultimoHtml = h; $("#lista").innerHTML = h; }
async function carregar() {
  if (carregando) return; carregando = true; // não deixa duas consultas ao mesmo tempo
  try { const r = await aut("/api/pedidos?dia=" + dia); if (!r.ok) throw 0; pedidos = await r.json(); avisarNovos(); $("#status").textContent = "online - " + new Date().toLocaleTimeString("pt-BR"); $("#status").className = ""; }
  catch (e) { $("#status").textContent = "SEM CONEXÃO - dados podem estar desatualizados"; $("#status").className = "off"; }
  carregando = false;
  if (!["contas", "clientes", "gaveta"].includes(aba)) desenhar(); else $("#n-aberto").textContent = pedidos.filter((p) => p.status === "aguardando").length;
}
function desenhar() {
  document.querySelectorAll("[data-aba]").forEach((b) => b.classList.toggle("on", b.dataset.aba === aba));
  const outra = aba === "contas" || aba === "clientes" || aba === "gaveta"; if (outra || aba === "painel") ultimoHtml = "";
  $("#busca").style.display = $("#dia").style.display = outra ? "none" : ""; $("#lista").classList.toggle("largo", aba === "contas");
  if (aba === "painel") return desenharPainel(); if (aba === "gaveta") return abrirGaveta(); if (aba === "contas") return abrirContas(); if (aba === "clientes") return carregarClientes().then(desenharClientes);
  $("#n-aberto").textContent = pedidos.filter((p) => p.status === "aguardando").length;
  if (aba === "fechamento") return pintar(fechamento());
  const st = { aberto: "aguardando", pagos: "pago", conta: "conta", cancelados: "cancelado" }[aba], q = $("#busca").value.trim().toLowerCase().replace("#", "");
  const lista = pedidos.filter((p) => p.status === st && (!q || (String(p.numero) === q || String(p.numeroLocal) === q) || (p.nome || "").toLowerCase().includes(q))).sort((a, b) => b.quando - a.quando);
  pintar(lista.length ? `<div class="pedidos">${lista.map(card).join("")}</div>` : `<div class="vazio-box"><span>🧾</span>Nenhum pedido aqui.</div>`);
}
const cxParado = () => { const v = localStorage.getItem("cxParado"); return v === null ? 20 : parseInt(v, 10) || 0; }; // minutos (0 = desligado)
const ultAtivCx = (p) => Math.max(p.quando || 0, ...(p.itens || []).map((c) => c.hora || 0));
const fmtMin = (m) => (m >= 60 ? Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") : m + " min");
function card(p) {
  const lim = cxParado(), minP = p.status === "aguardando" ? Math.max(0, Math.round((Date.now() - ultAtivCx(p)) / 60000)) : 0, par = lim > 0 && dia === new Date().toLocaleDateString("en-CA") && minP >= lim;
  const gs = pagsDe(p), recebido = soma(gs, (g) => g.valor), falta = Math.round((p.valor - recebido) * 100) / 100, fmt = (g) => `${FORMAS[g.forma] || g.forma} ${brl(g.valor)}`;
  const linha = (c) => `<li${c.pago ? ' class="pago"' : ""}><b>${c.qtd}x ${esc(c.nome)}</b>${p.tipo === "balanca" && (c.origem === "totem" || c.tipo === "bebida") ? ` <b class="it-p">${brl(c.preco * c.qtd)}</b>` : ""} ${(c.grupos || []).length ? esc((c.grupos || []).flatMap((g) => g.itens).join(", ")) : ""}${c.obs ? ` <i>(Obs: ${esc(c.obs)})</i>` : ""}${c.pago ? ` <span class="ac-chip">✓ ${FORMAS[c.pago.forma] || c.pago.forma}</span>` : ""}</li>`;
  const estornos = (p.pagamentos || []).filter((g) => !g.estornado).map((g) => `<button class="btn ruim mini" data-a="estornarPag" data-id="${p.id}" data-pag="${g.id}">Estornar ${fmt(g)}</button>`).join(" ");
  const rodape = p.status === "aguardando"
    ? (gs.length ? `<p class="pg">Já recebido: ${gs.map(fmt).join(" + ")} - <b>falta ${brl(falta)}</b></p>${estornos}` : "") + `<div class="acoes"><button class="btn ok" data-a="receber" data-id="${p.id}">${gs.length ? "Receber o resto" : "Receber"}</button>${gs.length ? "" : `<button class="btn" data-a="marcar" data-id="${p.id}">Marcar na conta</button>`}<button class="btn ruim" data-a="cancelar" data-id="${p.id}">Cancelar pedido</button></div>`
    : p.status === "conta" ? `<p class="pg">Na conta de <b>${esc(nomeCli(p.clienteId))}</b> <button class="btn ruim" data-a="desfazConta" data-id="${p.id}">Desfazer</button></p>`
    : p.status === "pago" ? `<p class="pg">Pago: ${gs.map(fmt).join(" + ")} às ${hora(p.pagoEm || p.quando)}</p>${estornos} <button class="btn ruim mini" data-a="cancelar" data-id="${p.id}">Cancelar/estornar tudo</button>` : "";
  return `<article class="card st-${p.status}${par ? " parado" : ""}"><div class="topo"><b class="num">${p.tipo === "balanca" ? "C" : "#"}${p.numero}</b>${p.numeroLocal && p.numeroLocal !== p.numero ? `<small>ticket ${p.numeroLocal}</small>` : ""}<span class="nome">${esc(p.nome || "Sem nome")}</span>${par ? `<span class="par-badge">⏰ há ${fmtMin(minP)}</span>` : ""}<span class="hora">${hora(p.quando)}</span><b class="valor">${brl(p.valor)}</b></div>
    <ul>${p.itens.map(linha).join("")}</ul>${rodape}</article>`;
}
function fechamento() {
  const recs = pedidos.flatMap(pagsDe), por = (f) => soma(recs.filter((g) => g.forma === f), (g) => g.valor), est = estornosDe(pedidos), conta = pedidos.filter((p) => p.status === "conta");
  return `<div class="cards"><div><b>${pedidos.filter((p) => p.status === "pago").length}</b>pedidos pagos</div><div><b>${brl(soma(recs, (g) => g.valor))}</b>recebido</div>
    <div><b>${pedidos.filter((p) => p.status === "cancelado").length}</b>cancelados</div><div><b>${pedidos.filter((p) => p.status === "aguardando").length}</b>em aberto</div></div>
    <p class="dica">Estornados: <b>${est.length}</b> (${brl(soma(est, (e) => e.valor))})</p><p class="dica">Marcado na conta neste dia: <b>${brl(soma(conta, (p) => p.valor))}</b> (${conta.length} pedidos)</p>
    <h3>Por forma de pagamento</h3><table>${Object.keys(FORMAS).map((f) => `<tr><td>${FORMAS[f]}</td><td>${recs.filter((g) => g.forma === f).length} recebimentos</td><td>${brl(por(f))}</td></tr>`).join("")}</table>
    <p class="dica">Dinheiro que deve estar na gaveta (só as vendas): <b>${brl(por("dinheiro"))}</b></p><button class="btn ok" data-a="zapResumo">📲 Enviar resumo no WhatsApp</button> <button class="btn" data-a="copiaResumo">📋 Copiar resumo</button> <button class="btn" data-a="csv">Exportar CSV do dia</button> <button class="btn" data-a="backup">Baixar backup completo</button>`;
}
function csv() {
  const L = [["Pedido", "Hora", "Cliente", "Itens", "Valor", "Status", "Pagamento"]];
  pedidos.forEach((p) => L.push([p.numero, hora(p.quando), p.nome || "", p.itens.map((c) => c.qtd + "x " + c.nome + ((c.grupos || []).length ? " (" + (c.grupos || []).flatMap((g) => g.itens).join(", ") + ")" : "") + (c.obs ? " [" + c.obs + "]" : "")).join(" | "), p.valor.toFixed(2).replace(".", ","), p.status, pagsDe(p).map((g) => (FORMAS[g.forma] || g.forma) + " " + g.valor.toFixed(2).replace(".", ",")).join(" + ")]));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + L.map((r) => r.map((x) => '"' + seguroCsv(x).replace(/"/g, '""') + '"').join(";")).join("\n")], { type: "text/csv" }));
  a.download = "pedidos-" + dia + ".csv"; a.click();
}
const patch = async (id, dados) => { // só dá certo se o servidor confirmar; senão avisa e não muda nada
  let ok = false;
  try {
    const r = await aut("/api/pedidos/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) });
    ok = r.ok; if (!ok) alert(((await r.json().catch(() => ({}))).erro) || "O servidor recusou a operação.");
  } catch (e) { alert("Sem conexão com o servidor. Nada foi alterado."); }
  carregar(); return ok;
};

document.addEventListener("click", async (e) => {
  if (e.target.id === "entrar") return entrar();
  if (e.target.dataset.aba) { aba = e.target.dataset.aba; return desenhar(); }
  const a = e.target.dataset.a, id = e.target.dataset.id; if (!a) return;
  if (a === "csv") return csv();
  if (a === "receber") return abrirAcerto(id);
  if (a === "fechar") return ($("#modal").hidden = true);
  if (a === "cancelar") {
    const ped = pedidos.find((x) => x.id === id); let motivo;
    if (ped && (ped.status === "pago" || pagsDe(ped).length)) { pedirMotivo(id); return; }
    else if (!confirm("Cancelar este pedido?")) return;
    patch(id, { status: "cancelado", motivo });
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "busca") desenhar();
});
document.addEventListener("change", (e) => { if (e.target.id === "dia" && e.target.value) { dia = e.target.value; ultimoAguard = null; carregar(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "pin") entrar(); });
// ===================== CONTAS (marcação), CLIENTES E EMPRESAS =====================
const seguroCsv = (x) => { const s = String(x); return /^([=@+\t\r]|-(?!\d))/.test(s) ? "'" + s : s; }; // planilha não executa texto como fórmula
const PAGFORMAS = { dinheiro: "Dinheiro", pix: "Pix", credito: "Crédito", debito: "Débito", transferencia: "Transferência" };
const dow = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"], hojeISO = () => new Date().toLocaleDateString("en-CA");
const dataBR = (d) => d.split("-").reverse().join("/"), soma = (a, f) => a.reduce((s, x) => s + f(x), 0), round2 = (n) => Math.round(n * 100) / 100;
const num = (id) => parseFloat(($(id) || { value: "" }).value.replace(",", "."));
let clientes = [], contas = { lancamentos: [], pagamentos: [], enviados: {}, anterior: {} }, mes = hojeISO().slice(0, 7), filtroEmp = "", mostrarTodos = false, editId = null, escolha = null, filtroCli = "", modalAtual = null;
const nomeCli = (id) => (clientes.find((x) => x.id === id) || {}).nome || "(cliente apagado)";
const chaveCli = (c) => (c.empresa ? "e:" + c.empresa : "c:" + c.id); // quem paga: a empresa (se tiver) ou o próprio cliente
const api = async (m, url, body) => {
  const r = await aut(url, { method: m, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }), j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.erro || "O servidor recusou a operação."); throw new Error(j.erro || "erro"); }
  return j;
};
async function carregarClientes() { try { clientes = await (await aut("/api/clientes")).json(); } catch (e) {} }
async function recarregar() { try { contas = await (await aut("/api/contas?mes=" + mes)).json(); } catch (e) {} if (aba === "contas") desenharContas(); }
async function abrirContas() { await carregarClientes(); await recarregar(); }
function abrirModal(h) {
  const m = $("#modal"), jaAberto = !m.hidden; m.hidden = false; m.innerHTML = '<div class="caixa-modal">' + h + "</div>";
  if (jaAberto) m.firstChild.style.animation = "none"; // não pisca ao atualizar
}
function diasDoMes(m) { const [a, b] = m.split("-").map(Number); return Array.from({ length: new Date(a, b, 0).getDate() }, (_, i) => m + "-" + String(i + 1).padStart(2, "0")); }
function resumoCli(c) { const ls = contas.lancamentos.filter((l) => l.clienteId === c.id); return { ls, qtd: soma(ls, (l) => l.qtd), total: soma(ls, (l) => l.valor) }; }
function resumoEnt(k) {
  const cs = clientes.filter((c) => chaveCli(c) === k), ids = new Set(cs.map((c) => c.id));
  const ls = contas.lancamentos.filter((l) => ids.has(l.clienteId)), ps = contas.pagamentos.filter((p) => p.chave === k);
  const ant = contas.anterior[k] || 0, total = soma(ls, (l) => l.valor), pago = soma(ps, (p) => p.valor);
  return { cs, ls, ps, ant, qtd: soma(ls, (l) => l.qtd), total, pago, saldo: round2(ant + total - pago) };
}
function statusTxt(r) {
  if (!r.ls.length && !r.ps.length && !r.ant) return "";
  const u = r.ps[r.ps.length - 1], quando = u ? " no " + (PAGFORMAS[u.forma] || u.forma || "?") + " dia " + dataBR(u.data).slice(0, 5) : "";
  const ind = r.cs.length === 1 && !r.cs[0].empresa ? r.cs[0] : null, env = contas.enviados[r.cs.length ? (r.cs[0].empresa ? "e:" + r.cs[0].empresa : "c:" + r.cs[0].id) : ""] ? "ENVIADO<br>" : "";
  let s;
  if (r.saldo > 0.009) s = ind && ind.pagamento !== "depois" ? "SEM CRÉDITO: deve " + brl(r.saldo) : r.pago > 0 ? "PARCIAL" + quando + ", falta " + brl(r.saldo) : "EM ABERTO";
  else s = "PAGO" + (r.saldo < -0.009 ? " (crédito " + brl(-r.saldo) + (ind && ind.modo === "refeicao" && ind.valorRefeicao ? " = " + Math.floor(-r.saldo / ind.valorRefeicao + 1e-9) + " refeições" : "") + ")" : "") + quando;
  return env + s;
}
function desenharContas() {
  const w0 = $(".gradewrap"), sx = w0 ? w0.scrollLeft : 0, sy = w0 ? w0.scrollTop : 0;
  const empresas = [...new Set(clientes.filter((c) => c.empresa).map((c) => c.empresa))].sort(), dias = diasDoMes(mes);
  const RC = new Map(clientes.map((c) => [c.id, resumoCli(c)])), RE = new Map(), ent = (k) => { if (!RE.has(k)) RE.set(k, resumoEnt(k)); return RE.get(k); };
  let cols = clientes.filter((c) => c.ativo !== false && (!filtroEmp || (filtroEmp === "_sem" ? !c.empresa : c.empresa === filtroEmp)));
  if (!mostrarTodos) cols = cols.filter((c) => { const e = ent(chaveCli(c)); return RC.get(c.id).ls.length || (!e.ls.length && (e.ps.length || e.ant)); });
  cols.sort((a, b) => (a.empresa ? 0 : 1) - (b.empresa ? 0 : 1) || (a.empresa || "").localeCompare(b.empresa || "") || a.nome.localeCompare(b.nome));

  const cel = (c, d) => { const ls = RC.get(c.id).ls.filter((l) => l.dia === d); if (!ls.length) return ""; const q = soma(ls, (l) => l.qtd), v = soma(ls, (l) => l.valor);
    return c.modo === "refeicao" && q > 0 ? String(q).replace(".", ",") : v.toFixed(2).replace(".", ","); };
  const linhaC = (rot, f, cls) => `<tr class="${cls || ""}"><td class="dia">${rot}</td>${cols.map((c) => `<td>${f(RC.get(c.id))}</td>`).join("")}</tr>`;
  const linhaG = (rot, f, cls) => `<tr class="${cls || ""}"><td class="dia">${rot}</td>${grupos.map((g) => { const t = f(g, ent(g.k)); return `<td colspan="${g.cols.length}" class="${String(t).includes("SEM CRÉDITO") ? "alerta" : ""}">${t}</td>`; }).join("")}</tr>`;
  const cardsEmp = empresas.map((e) => ({ e, r: ent("e:" + e) })).filter((x) => x.r.ls.length || x.r.ps.length || x.r.ant);
  $("#lista").innerHTML = `<div class="rel-topo"><label>Mês: <input type="month" id="mes" value="${mes}"></label>
    <label>Empresa: <select id="emp"><option value="">Todas</option>${empresas.map((e) => `<option value="${esc(e)}" ${filtroEmp === e ? "selected" : ""}>${esc(e)}</option>`).join("")}<option value="_sem" ${filtroEmp === "_sem" ? "selected" : ""}>Sem empresa</option></select></label>
    <label><input type="checkbox" id="todos" ${mostrarTodos ? "checked" : ""}> Mostrar todos os clientes</label>
    <button class="btn ok" data-a="novoLanc">＋ Marcar / lançar</button><button class="btn" data-a="csvContas">Exportar CSV</button></div>

  const aberto = soma(pedidos.filter((p) => p.status === "aguardando"), (p) => p.valor - soma(pagsDe(p), (g) => g.valor)), delta = fatO ? Math.round(((fat - fatO) / fatO) * 100) : null;
  const horas = Array(24).fill(0); pedidos.flatMap(pagsDe).forEach((g) => { horas[new Date(g.quando).getHours()] += g.valor; }); pedidos.filter((p) => p.status === "conta").forEach((p) => { horas[new Date(p.quando).getHours()] += p.valor; });

  $("#lista").innerHTML = `<div class="cards"><div><b>${brl(fat)}</b>faturado${delta === null ? "" : `<br><small>${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}% vs. dia anterior</small>`}</div><div><b>${vs.length}</b>vendas</div>
    <div><b>${brl(vs.length ? fat / vs.length : 0)}</b>ticket médio</div><div><b>${brl(aberto)}</b>em aberto</div></div>

}
